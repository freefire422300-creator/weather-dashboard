<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard - داشبورد هوا</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
            <p>داشبورد هواشناسی - دما و وضعیت هوا در سراسر جهان</p>
        </header>

        <!-- Search Section -->
        <div class="search-section">
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="جستجوی شهر (مثلاً: تهران، لندن، نیویورک)..."
                    class="search-input"
                >
                <button id="searchBtn" class="search-btn">
                    <i class="fas fa-search"></i> جستجو
                </button>
            </div>
            <div id="suggestions" class="suggestions"></div>
        </div>

        <!-- Current Weather Section -->
        <section class="current-weather">
            <div id="weatherCard" class="weather-card loading">
                <div class="loading-spinner">
                    <i class="fas fa-spinner"></i>
                </div>
            </div>
        </section>

        <!-- Weather Details -->
        <section class="weather-details" id="weatherDetails" style="display: none;">
            <div class="details-grid">
                <div class="detail-item">
                    <i class="fas fa-droplets"></i>
                    <span class="label">رطوبت</span>
                    <span class="value" id="humidity">-</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-wind"></i>
                    <span class="label">سرعت باد</span>
                    <span class="value" id="windSpeed">-</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-compress"></i>
                    <span class="label">فشار</span>
                    <span class="value" id="pressure">-</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-eye"></i>
                    <span class="label">دید</span>
                    <span class="value" id="visibility">-</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-cloud-rain"></i>
                    <span class="label">احتمال بارش</span>
                    <span class="value" id="precipitation">-</span>
                </div>
                <div class="detail-item">
                    <i class="fas fa-thermometer-half"></i>
                    <span class="label">احساس دما</span>
                    <span class="value" id="feelsLike">-</span>
                </div>
            </div>
        </section>

        <!-- Forecast Section -->
        <section class="forecast-section" id="forecastSection" style="display: none;">
            <h2>پیش‌بینی 7 روزه</h2>
            <div class="forecast-grid" id="forecastGrid">
                <!-- Forecast cards will be added here -->
            </div>
        </section>

        <!-- Hourly Forecast -->
        <section class="hourly-section" id="hourlySection" style="display: none;">
            <h2>پیش‌بینی هر ساعت (24 ساعت بعد)</h2>
            <div class="hourly-grid" id="hourlyGrid">
                <!-- Hourly cards will be added here -->
            </div>
        </section>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message" style="display: none;">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
